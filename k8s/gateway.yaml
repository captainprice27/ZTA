apiVersion: apps/v1
kind: Deployment
metadata:
  name: zta-gateway
  namespace: zta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zta-gateway
  template:
    metadata:
      labels:
        app: zta-gateway
    spec:
      containers:
        - name: gateway
          image: zta-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: zta-config
            - secretRef:
                name: zta-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: zta-gateway
  namespace: zta
spec:
  selector:
    app: zta-gateway
  ports:
    - port: 8080
      targetPort: 8080
