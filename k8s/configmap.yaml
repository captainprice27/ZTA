apiVersion: v1
kind: ConfigMap
metadata:
  name: zta-config
  namespace: zta
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  AiService__BaseUrl: "http://zta-ai-service:8000"
  Cors__AllowedOrigins__0: "http://localhost:5173"
  ConnectionStrings__DecisionCacheDb: "Data Source=/app/data/zta-cache.db"
  PolicyStore__Provider: "SqlServer"
