apiVersion: apps/v1
kind: Deployment
metadata:
  name: zta-ai-service
  namespace: zta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zta-ai-service
  template:
    metadata:
      labels:
        app: zta-ai-service
    spec:
      containers:
        - name: ai-service
          image: zta-ai-service:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: zta-ai-service
  namespace: zta
spec:
  selector:
    app: zta-ai-service
  ports:
    - port: 8000
      targetPort: 8000
